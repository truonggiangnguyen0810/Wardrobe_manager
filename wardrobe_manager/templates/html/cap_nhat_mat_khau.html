{% load static %}
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Tạo mật khẩu" }}</title>
    <link rel="stylesheet" href="{% static 'css/_tap.css' %}">
    <link rel="stylesheet" href="{% static 'css/cap_nhat_mat_khau.css' %}">
</head>
<body>
    <div class="app-container">
        <main class="content">
            <h1 class="page-title">{{ title|default:"Tạo mật khẩu" }}</h1>

            <!-- NOTE: hiện lỗi tổng (VD: "Hai mật khẩu không khớp") -->
            {% if form.non_field_errors %}
            <div class="error-msg" style="color:#e53936;margin-bottom:12px;text-align:center">
                {{ form.non_field_errors|join:", " }}
            </div>
            {% endif %}

            <!-- NOTE: form POST gửi mật khẩu + xác nhận lên server -->
            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <!-- Input 0: Mật khẩu hiện tại -->
                    <div class="input-field">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" name="mat_khau_hien_tai" placeholder="Mật khẩu hiện tại">
                        <button type="button" class="toggle-password has-tap" aria-label="Hiện mật khẩu">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>

                    <!-- Input 1: Mật khẩu mới -->
                    <div class="input-field">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" name="mat_khau" placeholder="Mật khẩu mới">
                        <button type="button" class="toggle-password has-tap" aria-label="Hiện mật khẩu">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>

                    <!-- Input 2: Xác nhận mật khẩu -->
                    <div class="input-field">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        <input type="password" name="xac_nhan_mat_khau" placeholder="Xác nhận mật khẩu mới">
                        <button type="button" class="toggle-password has-tap" aria-label="Hiện mật khẩu">
                            <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            <svg class="eye-off-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit has-tap">{{ button_text|default:"Tiếp tục" }}</button>
            </form>
        </main>
    </div>
    <script>
        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', () => {
                const field = btn.closest('.input-field');
                const input = field.querySelector('input');
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                field.classList.toggle('show-pass', show);
            });
        });
    </script>
    <script src="{% static 'js/cap_nhat_mat_khau.js' %}?v=1"></script>
</body>
</html>
