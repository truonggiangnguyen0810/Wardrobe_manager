<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm lịch trang phục</title>
    <link rel="stylesheet" href="../../static/css/_tap.css">
    <link rel="stylesheet" href="../../static/css/chon_cach_them_trang_phuc.css">
</head>
<body>
    <div class="app-container">
        <!-- Bottom Sheet (Modal lựa chọn) -->
        <div class="bottom-sheet">
            <!-- Nút đóng -->
            <button class="close-btn has-tap" aria-label="Đóng">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <!-- Tiêu đề -->
            <h2 class="sheet-title">Bạn muốn thêm trang phục như thế nào?</h2>

            <!-- Các lựa chọn -->
            <div class="options-grid">
                <!-- Lựa chọn 1: Sách trang phục -->
                <button class="option-card has-tap">
                    <div class="option-visual">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6"/></svg>
                    </div>
                    <span class="option-text">Sách trang phục</span>
                </button>

                <!-- Lựa chọn 2: Gợi ý trang phục -->
                <button class="option-card has-tap">
                    <div class="option-visual">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/></svg>
                    </div>
                    <span class="option-text">Gợi ý trang phục</span>
                </button>

                <!-- Lựa chọn 3: Sắp xếp tự do -->
                <button class="option-card has-tap">
                    <div class="option-visual">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46L16 2a4 4 0 01-8 0L3.62 3.46a2 2 0 00-1.34 2.23l.58 3.47a1 1 0 00.99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 002-2V10h2.15a1 1 0 00.99-.84l.58-3.47a2 2 0 00-1.34-2.23z"/></svg>
                    </div>
                    <span class="option-text">Sắp xếp tự do</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
