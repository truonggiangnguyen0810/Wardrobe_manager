<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài khoản cá nhân</title>
    <link rel="stylesheet" href="../../static/css/_tap.css">
    <link rel="stylesheet" href="../../static/css/quan_li_trang_ca_nhan.css">
</head>
<body>

    <!-- Mobile Frame -->
    <form class="app-container" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <!-- Header -->
        <header class="header">
            <div class="spacer"></div>
            <h1 class="header-title">Tài khoản cá nhân</h1>
            <div class="spacer"></div>
        </header>

        <main class="scroll-area" style="overflow-y: auto; flex: 1; margin-bottom: 90px;">
            <!-- Profile Avatar -->
            <div class="profile-section">
                <div class="avatar-wrapper">
                    <img id="avatarPreview" src="{% if user.ho_so.anh_dai_dien %}/media/{{ user.ho_so.anh_dai_dien }}{% else %}../../static/img/base-avatar.jpg{% endif %}" alt="Avatar" class="avatar">
                    <label class="btn-edit has-tap" for="avatarInput" style="display: flex; align-items: center; justify-content: center;">
                        <input type="file" id="avatarInput" name="anh_dai_dien" accept="image/*" hidden>
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    </label>
            </div>
        </div>

        <!-- Menu List -->
        <div class="menu-list">
            <!-- Item: Tên -->
            <div class="menu-item has-tap">
                <div class="menu-left">
                    <span class="menu-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </span>
                    <span class="menu-label">Tên</span>
                </div>
                <input type="text" class="menu-value-input" name="ho_ten" placeholder="Nhập tên của bạn" value="{{ user.ho_so.ho_ten|default:user.username }}">
            </div>

            <!-- Item: Giới tính -->
            <div class="menu-item has-tap">
                <div class="menu-left">
                    <span class="menu-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path>
                        </svg>
                    </span>
                    <span class="menu-label">Giới tính</span>
                </div>
                <select class="menu-value-select" name="gioi_tinh">
                    <option value="" disabled hidden {% if not user.ho_so.gioi_tinh %}selected{% endif %}></option>
                    <option value="nam" {% if user.ho_so.gioi_tinh == 'nam' %}selected{% endif %}>Nam</option>
                    <option value="nu" {% if user.ho_so.gioi_tinh == 'nu' %}selected{% endif %}>Nữ</option>
                    <option value="khac" {% if user.ho_so.gioi_tinh == 'khac' %}selected{% endif %}>Khác</option>
                </select>
            </div>

            <!-- Item: Cài đặt gợi ý trang phục -->
            <button class="menu-item has-tap" type="button" id="btnCaiDatGoiY">
                <div class="menu-left">
                    <span class="menu-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </span>
                    <div class="label-arrow">
                        <span class="menu-label">Cài đặt gợi ý trang phục</span>
                        <svg id="iconChevron" class="chevron-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="transition: transform 0.2s;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                </div>
            </button>
            <div id="goiYSection" style="display: none; padding: 0 16px 16px;">
                <textarea class="menu-value-input" id="quyDinhPhoiDo" name="quy_dinh_phoi_do" maxlength="500" style="width: 100%; height: 100px; padding: 12px; border-radius: 12px; border: 1px solid #ddd; resize: none; background: #fafafa; text-align: left;" placeholder="Ví dụ: thích phong cách tối giản...">{{ user.ho_so.quy_dinh_phoi_do|default:'' }}</textarea>
                <div id="goiYCount" style="text-align: right; font-size: 12px; color: #999; margin-top: 4px;">0/500</div>
            </div>


            <!-- Item: Đăng xuất -->
            <a href="{% url 'logout' %}" class="menu-item has-tap menu-logout" style="text-decoration: none;">
                <div class="menu-left">
                    <span class="menu-icon">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                    </span>
                    <span class="menu-label">Đăng xuất</span>
                </div>
            </a>
        </div>
        </main>

        <!-- Footer -->
        <div class="footer-section">
            <button type="submit" class="btn-save has-tap">
                Lưu thay đổi
            </button>
        </div>
    </form>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Preview Avatar
            const avatarInput = document.getElementById('avatarInput');
            const avatarPreview = document.getElementById('avatarPreview');
            if(avatarInput && avatarPreview) {
                avatarInput.addEventListener('change', function() {
                    const file = this.files[0];
                    if(file) {
                        const url = URL.createObjectURL(file);
                        avatarPreview.src = url;
                    }
                });
            }

            // Gợi ý trang phục toggle
            const btnCaiDatGoiY = document.getElementById('btnCaiDatGoiY');
            const goiYSection = document.getElementById('goiYSection');
            const iconChevron = document.getElementById('iconChevron');
            const txtGoiY = document.getElementById('quyDinhPhoiDo');
            const txtCount = document.getElementById('goiYCount');

            if(btnCaiDatGoiY && goiYSection) {
                btnCaiDatGoiY.addEventListener('click', () => {
                    if (goiYSection.style.display === 'none') {
                        goiYSection.style.display = 'block';
                        if(iconChevron) iconChevron.style.transform = 'rotate(180deg)';
                    } else {
                        goiYSection.style.display = 'none';
                        if(iconChevron) iconChevron.style.transform = 'rotate(0deg)';
                    }
                });
            }

            // Word count cho gợi ý
            if(txtGoiY && txtCount) {
                const updateCount = () => {
                    const len = txtGoiY.value.length;
                    txtCount.textContent = `${len}/500`;
                };
                txtGoiY.addEventListener('input', updateCount);
                updateCount();
            }
        });
    </script>
</body>
</html>
