{% load static %}
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhập thông tin cá nhân</title>
    <link rel="stylesheet" href="{% static 'css/_tap.css' %}">
    <link rel="stylesheet" href="{% static 'css/dang_ky_thong_tin_ca_nhan.css' %}?v=3">
    <style>
        .goiy-section { padding: 4px 0 8px; }
        .goiy-textarea {
            width: 100%; min-height: 96px; resize: vertical; box-sizing: border-box;
            border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px;
            font: inherit; line-height: 1.4; outline: none;
        }
        .goiy-textarea:focus { border-color: #1976d2; }
        .goiy-count { text-align: right; font-size: 12px; color: #888; margin-top: 4px; }
        .goiy-count.max-reached { color: #e53936; }
        #btnCaiDatGoiY[aria-expanded="true"] .chevron { transform: rotate(90deg); }
        .chevron { transition: transform .2s; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">Nhập thông tin cá nhân</h1>
        </header>

        <!-- NOTE: hiện lỗi tổng -->
        {% if form.non_field_errors %}
        <div class="error-msg" style="color:#e53936;text-align:center;padding:8px">
            {{ form.non_field_errors|join:", " }}
        </div>
        {% endif %}

        <!-- NOTE: form POST gửi họ tên + giới tính + ảnh đại diện lên server -->
        <form method="post" enctype="multipart/form-data">  <!-- NOTE: bắt buộc enctype để server nhận được file ảnh -->
            {% csrf_token %}
            <!-- Content -->
            <main class="content scroll-area">
                <!-- Avatar -->
                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <!-- NOTE: mặc định hiện base-avatar (ảnh đại diện trống); JS thay src khi user chọn ảnh -->
                        <img id="avatarPreview" src="{% static 'img/base-avatar.jpg' %}" alt="Avatar" class="avatar">
                        <button class="edit-avatar has-tap" type="button" id="btnEditAvatar" aria-label="Đổi ảnh đại diện">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
                <!-- NOTE: input ẩn nhận ảnh đại diện - nằm TRONG form để được gửi lên server khi "Hoàn tất" -->
                <input type="file" id="anhInput" name="anh_dai_dien" accept="image/*" hidden>

                <!-- Form List -->
                <div class="form-list">
                    <!-- NOTE: name="ho_ten" khớp với ThongTinCaNhanForm.ho_ten -->
                    <div class="form-item">
                        <span class="label">Tên</span>
                        <input type="text" class="value-input" name="ho_ten" placeholder="Nhập tên của bạn" value="{{ form.ho_ten.value|default:'' }}">
                    </div>
                    {% if form.ho_ten.errors %}
                    <span class="error-msg" style="color:#e53936;font-size:13px">{{ form.ho_ten.errors|join:", " }}</span>
                    {% endif %}

                    <!-- NOTE: name="gioi_tinh" khớp với ThongTinCaNhanForm.gioi_tinh -->
                    <div class="form-item">
                        <span class="label">Giới tính</span>
                        <select class="value-select" name="gioi_tinh">
                            <option value="" disabled selected hidden>--- Chọn ---</option>
                            <option value="nam" {% if form.gioi_tinh.value == 'nam' %}selected{% endif %}>Nam</option>
                            <option value="nu" {% if form.gioi_tinh.value == 'nu' %}selected{% endif %}>Nữ</option>
                            <option value="khac" {% if form.gioi_tinh.value == 'khac' %}selected{% endif %}>Khác</option>
                        </select>
                    </div>

                    <!-- NOTE: nút "Cài đặt gợi ý" bấm để mở/đóng ô nhập nội tuyến (không rời trang) -->
                    <button class="form-item has-tap" type="button" id="btnCaiDatGoiY" aria-expanded="false"
                            style="text-align:left;width:100%;background:none;border:none;color:inherit;font:inherit;cursor:pointer">
                        <span class="label">Cài đặt gợi ý trang phục</span>
                        <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>

                    <!-- NOTE: ô nhập cài đặt gợi ý nội tuyến (ẩn mặc định, nằm TRONG form -> gửi lên cùng "Hoàn tất") -->
                    <div class="goiy-section" id="goiYSection" hidden>
                        <textarea class="goiy-textarea" name="quy_dinh_phoi_do" id="quyDinhPhoiDo" maxlength="500"
                                  placeholder="Ví dụ: thích phong cách tối giản, ưu tiên tone đất, hạn chế màu sặc sỡ...">{{ quy_dinh_phoi_do }}</textarea>
                        <div class="goiy-count" id="goiYCount">0/500</div>
                    </div>
                </div>
            </main>

            <!-- Footer -->
            <footer class="footer">
                <button type="submit" class="btn-submit has-tap">Hoàn tất</button>
            </footer>
        </form>
    </div>

    <!-- Bottom-sheet chọn nguồn ảnh (mobile-first) -->
    <div class="sheet-overlay" id="sheetOverlay" hidden></div>
    <div class="action-sheet" id="actionSheet" hidden>
        <button class="sheet-item has-tap" type="button" id="optCamera">📷 Chụp ảnh</button>
        <button class="sheet-item has-tap" type="button" id="optLibrary">🖼️ Chọn từ thư viện</button>
        <button class="sheet-cancel has-tap" type="button" id="optCancel">Hủy</button>
    </div>

    <script src="{% static 'js/dang_ky_thong_tin_ca_nhan.js' %}?v=2"></script>
</body>
</html>
