<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết món đồ</title>
    <link rel="stylesheet" href="../../static/css/_tap.css">
    <link rel="stylesheet" href="../../static/css/cap_nhat_thong_tin_mon_do.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1 class="header-title">Chi tiết món đồ</h1>
        </header>

        <!-- Main Content -->
        <main class="content scroll-area">
            <div class="product-image">
                <img src="../../clothes-img/5.webp" alt="Áo sơ mi">
            </div>

            <div class="form-list">
                <div class="form-item has-tap">
                    <span class="label">Thông tin item</span>
                    <span class="value">Áo sơ mi tay dài</span>
                </div>
                <div class="form-item has-tap">
                    <span class="label">Mùa</span>
                    <span class="value dropdown">Mùa hè ▾</span>
                </div>
                <div class="form-item has-tap">
                    <span class="label">Dịp</span>
                    <span class="value dropdown">Hàng ngày, Hẹn hò, Tiệc ▾</span>
                </div>
                <div class="form-item has-tap">
                    <span class="label">Màu sắc</span>
                    <span class="value color-picker"><span class="color-dot"></span> ▾</span>
                </div>
                <div class="form-item has-tap">
                    <span class="label">Chất liệu</span>
                    <span class="value dropdown">Kaki ▾</span>
                </div>
            </div>
        </main>

        <!-- Bottom Actions -->
        <footer class="footer">
            <button class="btn-secondary has-tap">Hoàn tác</button>
            <button class="btn-primary has-tap">Lưu thay đổi</button>
        </footer>
    </div>
</body>
</html>
